services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduvision_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - eduvision-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduvision_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - eduvision-net

networks:
  eduvision-net:
    driver: bridge
